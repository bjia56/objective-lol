name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

jobs:
  build-go-binaries:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Windows
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          # macOS
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          # Linux
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
      with:
        go-version: '1.21'

    - name: Build olol binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -o olol-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} cmd/olol/main.go

    - name: Build olol-lsp binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        go build -o olol-lsp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} cmd/olol-lsp/main.go

    - name: Upload olol binary
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: olol-${{ matrix.goos }}-${{ matrix.goarch }}
        path: olol-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

    - name: Upload olol-lsp binary
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: olol-lsp-${{ matrix.goos }}-${{ matrix.goarch }}
        path: olol-lsp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  build-vscode:
    name: Build VSCode Extension
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: vscode/package-lock.json

    - name: Install dependencies
      working-directory: vscode
      run: npm ci

    - name: Install vsce
      run: npm install -g @vscode/vsce

    - name: Compile extension
      working-directory: vscode
      run: npm run compile

    - name: Package extension
      working-directory: vscode
      run: vsce package

    - name: Upload VSIX
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: vscode
        path: vscode/*.vsix

  build-python-sdist:
    name: Build Python sdist
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: '3.x'

    - name: Build sdist
      run: |
        python -m pip install build
        python -m build --sdist python --outdir sdist

    - name: Upload sdist
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: sdist
        path: sdist/*.tar.gz

  build-python-wheels:
    name: Build Python Wheels
    needs: build-python-sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-latest, windows-latest, macos-15-intel, macos-15]

    steps:
    # Wheels are built from the sdist (not the checkout) so the sdist is
    # exercised on every build.
    - name: Download sdist
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: sdist
        path: sdist

    # cibuildwheel's package-dir input is passed quoted, so a glob isn't expanded
    - name: Locate sdist
      id: sdist
      shell: bash
      run: echo "path=$(ls sdist/*.tar.gz)" >> "$GITHUB_OUTPUT"

    - name: Build wheels
      uses: pypa/cibuildwheel@ee02a1537ce3071a004a6b08c41e72f0fdc42d9a
      env:
        CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* gp311_*
        CIBW_ENABLE: graalpy
        # GraalPy builds without isolation, so build requirements must be preinstalled
        CIBW_BEFORE_BUILD: pip install pybindgen
        # GraalPy has no import library to link against on Windows
        CIBW_SKIP: "*-musllinux* *_i686 *-win32 gp*-win*"
        CIBW_BUILD_VERBOSITY: 1
        CIBW_PROJECT_REQUIRES_PYTHON: ">=3.9"
        CIBW_ENVIRONMENT: >
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
      with:
        package-dir: ${{ steps.sdist.outputs.path }}

    - name: Verify wheels
      shell: bash
      run: |
        ls -1 wheelhouse
        for tag in cp39 cp310 cp311 cp312 cp313 cp314; do
          ls wheelhouse/*-$tag-$tag-* > /dev/null || { echo "missing $tag wheel"; exit 1; }
        done

    - name: Upload wheels
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
      with:
        go-version: '1.21'

    - name: Run Go tests
      run: go test ./...

    - name: Build and test olol binary
      run: |
        go build -o olol cmd/olol/main.go
        go build -o olol-lsp cmd/olol-lsp/main.go