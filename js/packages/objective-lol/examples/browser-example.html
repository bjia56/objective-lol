<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Objective-LOL in the browser</title>
</head>
<body>
  <pre id="out"></pre>

  <!--
    Served without a bundler for this example: adjust the relative paths
    below to wherever the wasm/wasm_exec files end up in your build
    output. With a bundler (Vite/webpack), instead resolve them via an
    asset import, e.g.
      new URL('@objective-lol/core/wasm/objectivelol.wasm', import.meta.url)
    and pass the resulting URLs to createVM() below.

    Picking the standard-Go vs. TinyGo build (see README.md) is just a
    matter of which pair of URLs you reference here - swap both lines in
    WASM_VARIANTS below and a bundler will ship only the one you use.
  -->
  <script type="module">
    import { createVM } from "../src/index.browser.js";

    const WASM_VARIANTS = {
      go: { wasmURL: "../wasm/objectivelol.wasm", wasmExecURL: "../wasm/wasm_exec.js" },
      tinygo: { wasmURL: "../wasm/objectivelol-tinygo.wasm", wasmExecURL: "../wasm/wasm_exec-tinygo.js" },
    };

    const out = document.getElementById("out");
    const log = (...args) => {
      out.textContent += args.join(" ") + "\n";
    };

    async function main() {
      const vm = await createVM(WASM_VARIANTS.go); // or WASM_VARIANTS.tinygo

      await vm.execute(`
        I CAN HAS STDIO?
        HAI ME TEH FUNCSHUN MAIN
          SAYZ WIT "hello from Objective-LOL, running as wasm in your browser"
        KTHXBAI
      `);

      await vm.defineFunction("DOUBLE", 1, (x) => x * 2);
      log("DOUBLE(21) =", await vm.call("DOUBLE", 21));
    }

    main().catch((err) => log("ERROR:", err.message));
  </script>
</body>
</html>
